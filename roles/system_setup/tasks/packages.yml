# code: language=ansible
---

- name: Install Ubuntu packages
  become: true
  when: ansible_distribution == 'Ubuntu'
  block:
    - name: Install common packages
      ansible.builtin.apt:
        pkg:
          - curl
          - diffutils
          - etcd-client
          - htop
          - nnn
          - rasdaemon
          - rsync
          - sanoid
          - smartmontools
          - ufw
          - wakeonlan
          - zfsutils-linux
        update_cache: true

- name: Install OpenWrt packages
  when: detect_is_openwrt
  block:
    # Keep this list minimal on vendor SDK firmware (GL.iNet/QSDK). Packages that
    # shadow busybox applets or hook netfilter are risky here: the vendor's own init
    # and `gl-*` scripts are written against busybox semantics and the Qualcomm
    # NSS/ECM stack owns the netfilter fast path. `ip6tables-nft` and
    # `procps-ng-pkill` were previously installed but are referenced nowhere in this
    # repo, so they are not worth that risk.
    - name: Install common packages
      community.general.opkg:
        name:
          - diffutils
          - ethtool
          - fish
          - haproxy
          - htop
          - nnn
          - tailscale
          - tmux
          - vim

    # Only pull in SQM (and its kmod-sched-* dependencies) on hosts that actually
    # configure QoS; roles/qos takes the disable path when `qos` is undefined.
    - name: Install SQM packages
      when: qos is defined
      community.general.opkg:
        name:
          - luci-app-sqm
