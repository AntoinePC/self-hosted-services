# code: language=ansible
---

- name: Forward WAN ports to HAProxy VIP
  community.openwrt.uci:
    command: section
    config: firewall
    name: "haproxy_{{ item.name | lower }}"
    type: redirect
    value:
      name: "GL-HAProxy-{{ item.name }}"
      src: wan
      dest: lan
      proto: "{{ item.proto }}"
      src_dport: "{{ item.port }}"
      dest_ip: "{{ detect_haproxy_virtual_ip }}"
      dest_port: "{{ item.port }}"
      target: DNAT
    autocommit: true
  loop:
    - { name: HTTP, port: '80', proto: tcp udp }
    - { name: HTTPS, port: '443', proto: tcp udp }
    - { name: MX, port: '2465', proto: tcp }
    - { name: SMTP, port: '465', proto: tcp }
    - { name: IMAP, port: '993', proto: tcp }
  loop_control:
    label: "{{ item.name }}"
  notify: Restart firewall

- name: Forward Valheim WAN ports to Kubernetes NodePort
  vars:
    valheim_config: "{{ (((chartValuesOverrides | default({})).applications | default({})).valheim | default({})) }}"
    valheim_target_ip: "{{ (haproxy.servers | dict2items | first).value }}"
  when: valheim_config.enabled | default(false)
  ansible.builtin.shell: |
    set -eu
    uci -q delete firewall.valheim_game || true
    uci -q delete firewall.valheim_query || true
    uci batch <<'EOF'
    set firewall.valheim=redirect
    set firewall.valheim.name='GL-Valheim'
    set firewall.valheim.src='wan'
    set firewall.valheim.dest='lan'
    set firewall.valheim.proto='udp'
    set firewall.valheim.src_dport='2456-2457'
    set firewall.valheim.dest_ip='{{ valheim_target_ip }}'
    set firewall.valheim.dest_port='{{ valheim_config.node_ports.game | default(32456) }}-{{ valheim_config.node_ports.query | default(32457) }}'
    set firewall.valheim.target='DNAT'
    set firewall.valheim.reflection='1'
    commit firewall
    EOF
  changed_when: true
  notify: Restart firewall

- name: Remove Valheim WAN forwards when disabled
  vars:
    valheim_config: "{{ (((chartValuesOverrides | default({})).applications | default({})).valheim | default({})) }}"
  when: not (valheim_config.enabled | default(false))
  community.openwrt.uci:
    command: delete
    key: "firewall.{{ item }}"
    autocommit: true
  loop:
    - valheim
    - valheim_game
    - valheim_query
  failed_when: false
  notify: Restart firewall
