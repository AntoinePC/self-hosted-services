# code: language=ansible
---
- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart headscale
  become: true
  ansible.builtin.systemd:
    name: headscale
    enabled: true
    state: restarted

- name: Reload sqm
  become: true
  ansible.builtin.service:
    name: sqm
    state: reloaded

- name: Restart haproxy
  become: true
  ansible.builtin.service:
    name: haproxy
    state: restarted

- name: Reload network
  become: true
  ansible.builtin.service:
    name: network
    state: reloaded

# `nft -f` is transactional: if the generated ruleset has a single bad rule the whole
# load aborts and the router is left with no firewall and no NAT. Validate before
# restarting so a bad config fails the play loudly instead of silently downing the WAN.
- name: Validate fw4 ruleset
  listen: Restart firewall
  when: detect_is_openwrt | default(false)
  become: true
  ansible.builtin.command: sh -c 'fw4 print | nft -c -f -'
  changed_when: false

- name: Restart firewall service
  listen: Restart firewall
  become: true
  ansible.builtin.service:
    name: firewall
    state: restarted

- name: Restart nginx
  become: true
  ansible.builtin.service:
    name: nginx
    state: restarted
