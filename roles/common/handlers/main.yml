# code: language=ansible
---
# Network and SQM reloads may trigger firewall reloads themselves. Ansible runs
# handlers in definition order, so validation must precede all three services.
- name: Validate fw4 ruleset
  listen:
    - Restart firewall
    - Reload network
    - Reload sqm
  when: prepare_detect_is_openwrt | default(false)
  become: true
  ansible.builtin.command: fw4 check
  changed_when: false

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart headscale
  become: true
  ansible.builtin.systemd:
    name: headscale
    enabled: true
    state: restarted

- name: Reload sqm
  become: true
  ansible.builtin.service:
    name: sqm
    state: reloaded

- name: Restart haproxy
  become: true
  ansible.builtin.service:
    name: haproxy
    state: restarted

- name: Reload network
  become: true
  ansible.builtin.service:
    name: network
    state: reloaded

- name: Apply validated firewall configuration
  listen: Restart firewall
  become: true
  ansible.builtin.service:
    name: firewall
    # fw4 reload replaces nftables rules transactionally, without stop/start.
    state: "{{ 'reloaded' if prepare_detect_is_openwrt | default(false) else 'restarted' }}"

- name: Restart nginx
  become: true
  ansible.builtin.service:
    name: nginx
    state: restarted

- name: Reload udev
  become: true
  ansible.builtin.shell:
    cmd: udevadm control --reload-rules && udevadm trigger --subsystem-match=net --action=change
  changed_when: false
