# code: language=ansible

---
- name: Setup router
  any_errors_fatal: true
  hosts: routers
  gather_facts: false
  pre_tasks:
    - name: Install Python on OpenWrt
      ansible.builtin.raw: opkg update && opkg install python3
      register: install_python
      changed_when: "'Installing' in install_python.stdout"
  roles:
    - name: Global handlers
      role: common

    - name: Prepare hosts and controller state
      role: prepare

    - name: Configure router services
      role: router_setup
