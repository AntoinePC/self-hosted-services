{{- if and .Values.primaryTenant (include "app.enabled" (list . "nvidia_gpu")) }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nvidia-gpu
  namespace: kube-system
spec:
  chart: nvidia-device-plugin
  repo: https://nvidia.github.io/k8s-device-plugin
  version: 0.19.3
  targetNamespace: kube-system
  serverSide: "true"
  forceConflicts: true
  values:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: "dedicated"
        operator: Equal
        value: "ai"
        effect: "NoSchedule"
    nfd:
      enabled: false

    runtimeClassName: nvidia
    
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0300_10de.present
              operator: In
              values: ["true"]
    
    config:
      default: default
      map:
        default: |-
          version: v1
          flags:
            deviceDiscoveryStrategy: nvml
    
    resources:
      requests:
        memory: {{ include "app.resources.memory" (list $ "64Mi") }}
        cpu: {{ include "app.resources.cpu" (list $ "250m") }}
      limits:
        memory: 128Mi
{{- end }}
